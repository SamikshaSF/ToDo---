
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Registration Form</h1>

        <form id="studentForm">

            <label>Full Name:</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label>Email:</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label>Phone Number:</label>
            <input type="tel" id="phone" placeholder="Enter phone number">

            <label>Date of Birth:</label>
            <input type="date" id="dob">

            <label>Gender:</label>
            <div class="options">
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
                <input type="radio" name="gender" value="Other"> Other
            </div>

            <label>Select Courses:</label>
            <div class="options">
                <input type="checkbox" name="course" value="Java"> Java
                <input type="checkbox" name="course" value="Python"> Python
                <input type="checkbox" name="course" value="Web Development"> Web Development
                <input type="checkbox" name="course" value="Data Science"> Data Science
            </div>

            <label>Department:</label>
            <select id="department">
                <option value="">Select Department</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electronics">Electronics</option>
                <option value="Mechanical">Mechanical</option>
                <option value="Commerce">Commerce</option>
            </select>

            <button type="submit">Register</button>
            <button type="reset" class="reset">Clear</button>

        </form>

        <div id="error"></div>

        <div id="result">
            <h2>Registered Student Details</h2>
            <div id="studentDetails"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
